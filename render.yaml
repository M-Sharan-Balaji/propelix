services:
  - type: web
    name: propelix
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: TINYFISH_API_KEY
        sync: false
      - key: MYTHOS_LISTING_ID
        sync: false
